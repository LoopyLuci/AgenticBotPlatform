# OpenCV algorithm benchmarks as an ABP module: an overlay (ABP keeps this file; the checkout stays exactly upstream).
# Kept by hand. Operations: abp-ops.toml next to this file.

[module]
id = "opencv-benchmarks"
name = "OpenCV algorithm benchmarks"
repo = "https://github.com/opencv/opencv_benchmarks.git"
branch = "develop"
api = 1
area = "vision"
description = "Quality benchmarks for OpenCV's non-DNN algorithms: QR code detection and decoding, and calibration with generated boards."

[checkout]
marker = ["qr_codes/qr.py"]

[toolchain]
require = [{ tool = "python", min = "3.10", url = "https://www.python.org/downloads/" }, { tool = "git", url = "https://git-scm.com/downloads" }]

[hub]
start = ["{abp_python}", "-m", "abp_modkit", "serve", "--spec", "{overlay}/abp-ops.toml", "--project", "{repo}", "--home", "{data}", "--var", "target={target}"]
control_file = "{data}/control.json"
start_timeout_s = 30

[mcp]
stdio = ["{abp_python}", "-m", "abp_modkit", "mcp", "--home", "{data}"]

[ui]
panel = "operations"
