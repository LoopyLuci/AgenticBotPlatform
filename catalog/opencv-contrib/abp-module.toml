# OpenCV contrib as an ABP module: an overlay (ABP keeps this file; the checkout stays exactly upstream).
# Kept by hand. Operations: abp-ops.toml next to this file.

[module]
id = "opencv-contrib"
name = "OpenCV contrib"
repo = "https://github.com/opencv/opencv_contrib.git"
branch = "5.x"
api = 1
area = "vision"
description = "OpenCV's extra modules (text, face, tracking, xfeatures2d, wechat_qrcode, cudev, ...), built into OpenCV by the OpenCV module's build.configure."

[checkout]
marker = ["modules/README.md"]

[toolchain]
require = [{ tool = "git", url = "https://git-scm.com/downloads" }]

[hub]
start = ["{abp_python}", "-m", "abp_modkit", "serve", "--spec", "{overlay}/abp-ops.toml", "--project", "{repo}", "--home", "{data}", "--var", "target={target}"]
control_file = "{data}/control.json"
start_timeout_s = 30

[mcp]
stdio = ["{abp_python}", "-m", "abp_modkit", "mcp", "--home", "{data}"]

[ui]
panel = "operations"
