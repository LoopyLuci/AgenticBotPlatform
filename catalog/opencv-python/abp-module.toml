# opencv-python as an ABP module: an overlay (ABP keeps this file; the checkout stays exactly upstream).
# Kept by hand. Operations: abp-ops.toml next to this file.

[module]
id = "opencv-python"
name = "opencv-python"
repo = "https://github.com/opencv/opencv-python.git"
branch = "4.x"
api = 1
area = "vision"
description = "The builder of OpenCV's Python wheels (opencv-python, -contrib, -headless): build a wheel of OpenCV for this machine."

[checkout]
marker = ["setup.py", "pyproject.toml"]

[toolchain]
require = [{ tool = "cmake", min = "3.16", url = "https://cmake.org/download/" }, { tool = "python", min = "3.10", url = "https://www.python.org/downloads/" }, { tool = "git", url = "https://git-scm.com/downloads" }]

[hub]
start = ["{abp_python}", "-m", "abp_modkit", "serve", "--spec", "{overlay}/abp-ops.toml", "--project", "{repo}", "--home", "{data}", "--var", "target={target}"]
control_file = "{data}/control.json"
start_timeout_s = 30

[mcp]
stdio = ["{abp_python}", "-m", "abp_modkit", "mcp", "--home", "{data}"]

[ui]
panel = "operations"
