[package]
name = "abp-wasm-example-hello"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "The smallest useful ABP WebAssembly plugin: one tool, no capabilities"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# A component is a cdylib. `cargo build --target wasm32-wasip2 --release` writes the
# .wasm here, which is what `abp_wasm.load()` takes.
crate-type = ["cdylib"]

[dependencies]
# A path dependency, so the example builds against this checkout's SDK and world.
abp-wasm-sdk = { path = "../../../sdk/wasm/rust" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
