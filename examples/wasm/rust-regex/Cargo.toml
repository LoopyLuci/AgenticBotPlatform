[package]
name = "abp-wasm-example-regex"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "An ABP WebAssembly plugin that extracts things from text: emails, URLs, addresses, tags"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
abp-wasm-sdk = { path = "../../../sdk/wasm/rust" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
