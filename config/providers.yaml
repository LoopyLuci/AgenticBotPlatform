# Named custom model providers — see bot/providers.py.
#
# Each entry lets a bot instance route through backend "custom_model"
# with model set to "<name>/<model_id>", talking to any OpenAI-compatible
# endpoint: a locally running Ollama/LM Studio/vLLM/llama.cpp server, an
# internal gateway, OpenRouter, or real OpenAI.
#
# Example:
#
# providers:
#   local_ollama:
#     base_url: "http://127.0.0.1:11434/v1"
#     protocol: openai
#   openrouter:
#     base_url: "https://openrouter.ai/api/v1"
#     api_key_env: OPENROUTER_API_KEY
#     protocol: openai
providers: {}
