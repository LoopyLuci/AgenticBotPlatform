default_backend: cli
action_overrides:
  quick_question:
    backend: cli
    backup: []
  project_task:
    backend: cli
    backup: []
  desktop_specific:
    backend: ui
    backup: []
backends:
  api:
    model: claude-sonnet-5
    max_tokens: 4096
  cli:
    binary: claude
    mode: print
    allowed_tools: []
    cwd: null
  ui:
    window_title_re: Claude.*
    poll_interval_s: 0.5
    # input_automation_id: null
    # send_button_automation_id: null
    # new_chat_button_automation_id: null   # set if the heuristic ("New chat" / "+" button text) doesn't find it
    # sidebar_item_control_type: ListItem   # set to TreeItem etc if your Claude Desktop version exposes chats that way
  hermes_cli:
    binary: hermes
    model: null
  hermes_gateway:
    binary: hermes
    port: 8799
    model: null
timeouts:
  api: 30
  cli: 60
  ui: 45
env_file: null
desktop:
  exe_path: null
security:
  confirm_destructive: true
features:
  ui_automation_enabled: true
  verbose_telemetry: true
agent_control:
  mode: trust_all
