default_backend: cli
action_overrides:
  quick_question:
    backend: cli
    backup: []
  project_task:
    backend: cli
    backup: []
  desktop_specific:
    backend: ui
    backup: []
backends:
  api:
    model: claude-sonnet-5
    max_tokens: 4096
  cli:
    binary: claude
    mode: print
    allowed_tools: []
    cwd: null
  ui:
    window_title_re: Claude.*
    poll_interval_s: 0.5
    # input_automation_id: null
    # send_button_automation_id: null
    # new_chat_button_automation_id: null   # set if the heuristic ("New chat" / "+" button text) doesn't find it
    # sidebar_item_control_type: ListItem   # set to TreeItem etc if your Claude Desktop version exposes chats that way
  hermes_cli:
    binary: hermes
    model: null
  hermes_gateway:
    binary: hermes
    port: 8799
    model: null
timeouts:
  api: 30
  cli: 60
  ui: 45
env_file: null
desktop:
  exe_path: null
security:
  confirm_destructive: true
features:
  ui_automation_enabled: true
  verbose_telemetry: true
agent_control:
  mode: trust_all
retention:
  # Automatic pruning for the highest-volume, lowest-long-term-value
  # tables — job attempts, telemetry samples, connection-health events,
  # and Support Bot classification logs. None of these grow forever for
  # free: left unmanaged, a long-running server's database only gets
  # bigger and slower to query, with no way to reclaim it short of
  # someone finding the dashboard's manual Vacuum button. Deliberately
  # does NOT touch audit_log (a security trail, kept longer by design),
  # chat/session history, or config_history — those have real long-term
  # value at a fraction of the row volume. Runs once a day; see
  # bot/retention.py.
  enabled: true
  days: 90
  # 0 = never (default) — VACUUM reclaims the disk space pruning above
  # frees up, but briefly locks writes, so it's opt-in rather than always
  # on. Set to e.g. 7 to run it automatically at most once a week.
  auto_vacuum_every_days: 0
turn:
  # Real TURN relay for the Android mesh transport's WebRTC fallback (see
  # bot/turn.py) — used when two devices can't reach each other directly
  # (symmetric NAT, restrictive firewalls) even with STUN's help. Off by
  # default: enabling it requires an actual TURN server (coturn is the
  # standard choice) running with the same shared secret configured below
  # (coturn's `use-auth-secret` + `static-auth-secret`) — see
  # docs/turn-server-setup.md. BotServer only ever mints short-lived
  # HMAC credentials from this secret; it never runs the relay itself.
  enabled: false
  secret: null
  urls: []
  ttl_s: 3600
