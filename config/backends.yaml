default_backend: cli
action_overrides:
  quick_question:
    backend: cli
    backup: []
  project_task:
    backend: cli
    backup: []
  desktop_specific:
    backend: ui
    backup: []
backends:
  api:
    model: claude-sonnet-5
    max_tokens: 4096
  cli:
    binary: claude
    mode: print
    allowed_tools: []
    cwd: null
  ui:
    window_title_re: Claude.*
    poll_interval_s: 0.5
    # input_automation_id: null
    # send_button_automation_id: null
    # new_chat_button_automation_id: null   # set if the heuristic ("New chat" / "+" button text) doesn't find it
    # sidebar_item_control_type: ListItem   # set to TreeItem etc if your Claude Desktop version exposes chats that way
  hermes_cli:
    binary: hermes
    model: null
  hermes_gateway:
    binary: hermes
    port: 8799
    model: null
timeouts:
  api: 30
  cli: 60
  ui: 45
  # Hermes backends legitimately run far longer than a single Claude
  # turn — hermes_gateway's own delegate_task can fan out several
  # sub-agents that each run their own multi-step tool loop before the
  # parent synthesizes a final answer (see the Hermes-swarm plan's
  # dispatch_swarm_goal). Without these, both fell back to the generic
  # 30s default and a real swarm dispatch would time out almost
  # immediately.
  hermes_cli: 300
  hermes_gateway: 900
env_file: null
desktop:
  exe_path: null
security:
  confirm_destructive: true
features:
  ui_automation_enabled: true
  verbose_telemetry: true
agent_control:
  mode: trust_all
# Pre-dispatch cost ceiling for dispatch_swarm_goal — see bot/swarm_budget.py.
# This is a worst-case ESTIMATE gate (max_children x assumed tokens/child x
# the resolved model's known per-token price), not a real spend tracker —
# the Hermes gateway backend never reports actual token usage back to
# BotServer today, a real, documented limitation (see that module's
# docstring). Refuses to dispatch (never configures Hermes's own delegation
# config, never sends anything) when the estimate can't be trusted or
# exceeds these caps; a swarm_dispatch_blocked audit entry is logged either
# way and shows up in the dashboard's Delegation Activity panel.
swarm_budget:
  enabled: true
  max_children: 6
  max_estimated_usd: 0.25
  require_confirm_above_usd: 1.0
  # Off by default: an explicitly-chosen model with no known price is
  # common and legitimate (a local custom_model/Ollama model genuinely has
  # no $ price; a brand-new provider entry just hasn't been priced by
  # Hermes's own inventory yet) — set true for maximum protection if
  # every worker model in your setup is expected to have real pricing.
  deny_unpriced_paid_models: false
  assumed_tokens_per_child:
    input: 2000
    output: 1000
# Optional live top-level tool-event tap for a dispatch, over the Hermes
# gateway's SSE stream — see bot/swarm/observability.py. Purely additive
# observability: turning this off (or it simply failing against an older
# Hermes version with no SSE route) never affects whether a dispatch
# itself succeeds.
swarm_observability:
  live_tool_events: true
# spawn_subagent (bot/agent_runtime/subagents.py) — ephemeral, disposable
# sub-agent fan-out for api/custom_model-backed instances, the native
# equivalent of Hermes Agent's own delegate_task. Depth is governed by
# the existing agent_runtime.max_delegation_depth key (not duplicated
# here) — this section only holds concerns unique to a batch of children.
native_agent:
  max_concurrent_children: 6
# Applies an edit to bot/*.py to this already-running process instead of
# needing the full stop/rebuild/relaunch cycle — see bot/hotreload.py's
# module docstring for exactly what can and can't hot-reload. Checked
# live on every detected file change, so toggling this takes effect
# immediately, the same as every other key in this file.
hot_reload_enabled: true
retention:
  # Automatic pruning for the highest-volume, lowest-long-term-value
  # tables — job attempts, telemetry samples, connection-health events,
  # and Support Bot classification logs. None of these grow forever for
  # free: left unmanaged, a long-running server's database only gets
  # bigger and slower to query, with no way to reclaim it short of
  # someone finding the dashboard's manual Vacuum button. Deliberately
  # does NOT touch audit_log (a security trail, kept longer by design),
  # chat/session history, or config_history — those have real long-term
  # value at a fraction of the row volume. Runs once a day; see
  # bot/retention.py.
  enabled: true
  days: 90
  # 0 = never (default) — VACUUM reclaims the disk space pruning above
  # frees up, but briefly locks writes, so it's opt-in rather than always
  # on. Set to e.g. 7 to run it automatically at most once a week.
  auto_vacuum_every_days: 0
turn:
  # Real TURN relay for the Android mesh transport's WebRTC fallback (see
  # bot/turn.py) — used when two devices can't reach each other directly
  # (symmetric NAT, restrictive firewalls) even with STUN's help. Off by
  # default: enabling it requires an actual TURN server (coturn is the
  # standard choice) running with the same shared secret configured below
  # (coturn's `use-auth-secret` + `static-auth-secret`) — see
  # docs/turn-server-setup.md. BotServer only ever mints short-lived
  # HMAC credentials from this secret; it never runs the relay itself.
  enabled: false
  secret: null
  urls: []
  ttl_s: 3600
