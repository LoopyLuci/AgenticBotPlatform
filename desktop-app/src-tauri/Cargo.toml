[package]
name = "agentic-bot-platform"
version = "0.7.24"
description = "All-in-one desktop shell for Agentic Bot Platform: boots and supervises the Python bot process and hosts its dashboard in one window."
edition = "2021"

[lib]
name = "agentic_bot_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
# Update checking/downloading (see src/updater.rs) — the one new
# dependency this feature needs. ureq over reqwest: this app only ever
# makes a couple of small, synchronous HTTP calls (GitHub's releases API,
# then one installer download), so a lightweight blocking client is a
# better fit than reqwest's async runtime and much larger dependency tree.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Real embedded terminal (src/terminal.rs) — ConPTY on Windows via the same
# portable-pty crate WezTerm itself uses, so interactive programs (git's
# pager, python's REPL, colored output) behave like a real terminal instead
# of the garbled mess plain piped stdio produces for anything that isn't a
# straight-line, non-interactive command.
portable-pty = "0.8"
# Verifies the update installer's detached Ed25519 signature (src/updater.rs)
# against the public key embedded in the binary, so a compromised GitHub
# account/release can't push code to installed apps.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
