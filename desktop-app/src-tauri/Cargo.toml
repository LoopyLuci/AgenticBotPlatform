[package]
name = "bot-server"
version = "0.1.0"
description = "All-in-one desktop shell for Bot Server: boots and supervises the Python bot process and hosts its dashboard in one window."
edition = "2021"

[lib]
name = "bot_server_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
