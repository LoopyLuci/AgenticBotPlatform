name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — compile, tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Every .py file must at least parse — this is what would have
      # caught the raw r"...\" string-literal syntax error this project
      # shipped once before a human noticed, before any test even runs.
      - name: Byte-compile every source file
        run: python -m compileall -q bot scripts

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      # Verified clean locally on 2026-08-28 (pip-audit -r requirements.txt
      # --strict — no known vulnerabilities) before flipping this blocking;
      # no pre-existing backlog was found to triage.
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --strict

  docker:
    name: Docker — image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t botserver:ci .

  bare-metal:
    name: Bare metal — headless run works without Docker or a desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Proves the README's "Bare metal (no Docker, no desktop app)"
      # quickstart actually works on a clean checkout — same kind of real
      # verification the docker job above does for the container path, not
      # just documentation nobody's run.
      - name: Write a minimal .env
        run: |
          cat > .env <<'EOF'
          ANTHROPIC_API_KEY=sk-ci-placeholder
          DASHBOARD_TOKEN=ci-placeholder-token
          TELEGRAM_BOT_TOKEN=123456789:CIPlaceholderTokenPaddingXXXXXXXXXX
          ALLOWED_TELEGRAM_USER_IDS=1
          EOF

      - name: Install (no Rust/Tauri, no build offer, non-interactive)
        run: python scripts/install.py --no-system-deps --no-build --no-autostart --yes

      - name: Boot headlessly and confirm the dashboard answers
        run: |
          .venv/bin/python -m bot.main &
          pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          [ -n "$ok" ] || { echo "dashboard never became healthy"; exit 1; }

  rust:
    name: Rust — format, clippy, build check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      # tauri.conf.json's bundle.resources lists ../../.venv — tauri_build
      # checks that every resource path actually exists even for a plain
      # `cargo check`/`clippy` (not just real bundling), so a fresh CI
      # checkout (which has no venv at all) needs a placeholder here. Its
      # contents are never inspected outside a real `tauri build`.
      - name: Create placeholder .venv (tauri_build checks resource paths exist)
        run: New-Item -ItemType Directory -Force -Path ..\..\.venv | Out-Null

      # The pre-existing formatting backlog (27 diff hunks across 4 files)
      # was cleared with a real `cargo fmt` run on 2026-08-28 — verified
      # cosmetic-only (line-wrapping, brace placement, no logic changes) by
      # reviewing the diff, and `cargo fmt --check` now passes clean.
      - name: Check formatting
        run: cargo fmt --check

      # Verified clean locally on 2026-08-28 (cargo clippy --all-targets -- -D
      # warnings — zero warnings) before flipping this blocking.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build check (no bundling — no Python venv available in CI)
        run: cargo check --release
