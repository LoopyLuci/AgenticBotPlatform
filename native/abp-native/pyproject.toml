[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "abp-native"
version = "0.1.0"
description = "ABP's Rust fast paths (the compiled half of the abp_native Python package)"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# The Python half lives in the abp_native/ package at the repository root (the pure-Python
# reference every fast path falls back to); this crate builds only the accelerator that
# abp_native loads when it is present. One name, one import, no mixed-layout shadowing.
module-name = "abp_native_core"
bindings = "pyo3"
strip = true
