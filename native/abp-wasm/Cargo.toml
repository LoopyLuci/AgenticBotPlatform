[package]
name = "abp-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "ABP's WebAssembly component runtime: the host half of the abp:plugin world, as a Python extension module"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "abp_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3 so one build works for every CPython 3.11+ ABP supports.
pyo3 = { version = "0.29", features = ["abi3-py311"] }
wasmtime = { version = "49", default-features = false, features = [
    "cranelift",
    "component-model",
    "async",
    "runtime",
    "std",
    "gc",
    "gc-drc",
    "pooling-allocator",
    "parallel-compilation",
    "cache",
    "demangle",
    "addr2line",
] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
anyhow = "1"

[features]
# `cargo test` needs the Python symbols linked into the test binary rather than looked up
# in the interpreter at import time. maturin turns this off for the shipped wheel.
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Deliberately not panic = "abort": a panic in here is a bug in the host, and it has to come
# back to Python as an exception rather than take the whole ABP process with it.
